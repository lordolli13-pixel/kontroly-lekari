<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" id="theme-meta" content="#1e2124">
    <title>Deník Zdraví PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root {
            --bg: #1e2124; --box-bg: #1e2124; --light-shadow: #2a2e33; --dark-shadow: #121416;
            --accent: #ff9f43; --text-main: #ffffff; --text-dim: #b0b0b0;
            --border-amber: rgba(255, 159, 67, 0.4); --danger: #ff4d4d; --whatsapp: #25d366; --input-bg: #1e2124;
            --overlay: rgba(0, 0, 0, 0.9);
        }
        [data-theme="light"] {
            --bg: #e0e5ec; --box-bg: #e0e5ec; --light-shadow: #ffffff; --dark-shadow: #a3b1c6;
            --accent: #e67e22; --text-main: #2c3e50; --text-dim: #7f8c8d;
            --border-amber: rgba(230, 126, 34, 0.4); --danger: #e74c3c; --whatsapp: #27ae60; --input-bg: #e0e5ec;
            --overlay: rgba(255, 255, 255, 0.9);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, system-ui, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 12px; transition: background 0.3s ease; font-weight: 600; overflow-x: hidden; }
        .container { width: 100%; max-width: 450px; margin: auto; }
        
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h2 { margin: 0; font-weight: 900; color: var(--accent); text-transform: uppercase; font-size: 16px; }
        .top-icons { display: flex; gap: 10px; }
        .icon-btn { width: 42px; height: 42px; border-radius: 12px; background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 8px var(--dark-shadow), -4px -4px 8px var(--light-shadow); border: 1px solid var(--border-amber); font-size: 18px; }

        .neu-box { background: var(--box-bg); border-radius: 20px; padding: 15px; box-shadow: 6px 6px 12px var(--dark-shadow), -6px -6px 12px var(--light-shadow); border: 1px solid var(--border-amber); margin-bottom: 20px; }
        input, select { width: 100%; border: 1px solid var(--border-amber); outline: none; background: var(--input-bg); padding: 12px; border-radius: 12px; box-shadow: inset 3px 3px 6px var(--dark-shadow); margin-bottom: 10px; font-size: 16px; color: var(--text-main); font-weight: 700; }
        
        .btn { background: var(--bg); border: 2px solid var(--border-amber); border-radius: 12px; padding: 15px; font-weight: 900; color: var(--accent); box-shadow: 3px 3px 6px var(--dark-shadow), -3px -3px 6px var(--light-shadow); cursor: pointer; text-align: center; text-transform: uppercase; font-size: 14px; width: 100%; display: block; margin-bottom: 10px; }
        .btn:active { transform: scale(0.98); box-shadow: inset 2px 2px 5px var(--dark-shadow); }

        .tags-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .tag { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; border-radius: 15px; box-shadow: 3px 3px 6px var(--dark-shadow), -3px -3px 6px var(--light-shadow); cursor: pointer; border: 2px solid transparent; text-align: center; min-height: 75px; transition: 0.2s; }
        .tag span { font-size: 24px; pointer-events: none; }
        .tag-name { font-size: 9px; font-weight: 900; text-transform: uppercase; width: 100%; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }

        .month-header { background: var(--accent); color: var(--bg); padding: 6px 14px; border-radius: 8px; font-weight: 900; text-transform: uppercase; font-size: 11px; display: inline-block; margin: 15px 0 10px 0; }
        .entry { background: var(--box-bg); padding: 15px; border-radius: 18px; margin-bottom: 12px; box-shadow: 4px 4px 10px var(--dark-shadow); position: relative; border-left: 5px solid var(--accent); width: 100%; }
        .trash-btn { position: absolute; right: 10px; top: 10px; color: var(--danger); cursor: pointer; font-size: 18px; opacity: 0.7; }
        .wa-link { color: var(--whatsapp); font-size: 11px; font-weight: 900; cursor: pointer; text-decoration: none; display: block; margin-top: 10px; text-transform: uppercase; }

        /* MODÁLY */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(8px); }
        .modal-content { width: 95%; max-width: 400px; max-height: 90vh; overflow-y: auto; position: relative; padding: 10px; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: var(--accent); font-weight: 900; z-index: 110; }
        .modal-overlay.active { display: flex; }

        /* QR Specifické */
        #qrcode { background: white; padding: 15px; border-radius: 15px; display: flex; justify-content: center; margin: 20px 0; }
        #reader { width: 100%; border-radius: 15px; overflow: hidden; }

        .modal-doc-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--dark-shadow); border-radius: 12px; margin-bottom: 8px; border-left: 4px solid var(--accent); }
        .settings-trigger { text-align: center; margin: 30px 0; color: var(--text-dim); font-size: 12px; cursor: pointer; text-decoration: underline; font-weight: 800; }
        hr { border: 0; border-top: 1px solid var(--border-amber); margin: 20px 0; opacity: 0.3; }
    </style>
</head>
<body data-theme="dark">

<div class="container">
    <div class="header-area">
        <h2>🩺 Zdraví PRO</h2>
        <div class="top-icons">
            <div class="icon-btn" onclick="toggleTheme()">☀️</div>
            <div class="icon-btn" onclick="openQRMenu()">📲</div>
            <div class="icon-btn" onclick="openModal()">⚙️</div>
        </div>
    </div>

    <div class="neu-box">
        <div class="tags-grid" id="tags-area"></div>
        <select id="person-select"></select>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
            <input type="date" id="date-input" style="flex: 1.2; margin: 0;">
            <input type="time" id="time-input" style="flex: 0.8; margin: 0;">
        </div>
        <input type="text" id="doctor-input" placeholder="Lékař / Ambulance">
        <input type="hidden" id="color-input" value="#ff9f43">
        <input type="text" id="note-input" placeholder="Poznámka...">
        <div class="btn" onclick="saveEntry()">Uložit záznam</div>
    </div>

    <div id="main-list"></div>
    <div class="settings-trigger" onclick="openModal()">⚙️ NASTAVENÍ A LÉKAŘI</div>
</div>

<div class="modal-overlay" id="modal-settings">
    <div class="modal-content">
        <div class="neu-box">
            <span class="close-modal" onclick="closeModal()">×</span>
            <h4 style="color: var(--accent); text-transform: uppercase;">Správa lékařů</h4>
            <div id="modal-docs-list"></div>
            <hr>
            <h4>➕ NOVÝ LÉKAŘ</h4>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="new-doc-name" placeholder="Název" style="flex: 2;">
                <select id="new-doc-icon" style="flex: 1;"><option>🏥</option><option>🦷</option><option>👁️</option><option>💊</option><option>🩺</option></select>
            </div>
            <input type="color" id="new-doc-color" value="#ff9f43" style="width: 100%; height: 40px; border:none; background:none;">
            <div class="btn" onclick="addDoctor()">Přidat</div>
            <hr>
            <h4>PACIENTI</h4>
            <input type="text" id="p1-name" placeholder="Jméno 1">
            <input type="text" id="p2-name" placeholder="Jméno 2">
            <div class="btn" onclick="updateNames()">Uložit jména</div>
            <hr>
            <div class="btn" onclick="clearData()" style="color: var(--danger); border-color: var(--danger); font-size: 11px;">⚠️ SMAZAT VŠE</div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-qr">
    <div class="modal-content">
        <div class="neu-box">
            <span class="close-modal" onclick="closeQRModal()">×</span>
            <h4 style="color: var(--accent); text-transform: uppercase;">Přenos dat</h4>
            
            <div class="btn" onclick="generateQR()">Zobrazit můj QR kód</div>
            <div id="qrcode"></div>
            <p style="font-size: 10px; text-align: center; color: var(--text-dim);">Druhý telefon naskenuje tento kód pro import dat.</p>
            
            <hr>
            
            <div class="btn" onclick="startScanner()">Naskenovat druhý telefon</div>
            <div id="reader"></div>
        </div>
    </div>
</div>

<script>
    const escapeHTML = (str) => { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; };
    let html5QrCode;

    document.addEventListener('DOMContentLoaded', () => { 
        setTheme(localStorage.getItem('theme') || 'dark'); 
        initApp(); 
    });

    function setTheme(t) { document.body.setAttribute('data-theme', t); localStorage.setItem('theme', t); }
    function toggleTheme() { setTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }

    function openModal() { document.getElementById('modal-settings').classList.add('active'); renderTags(); }
    function closeModal() { document.getElementById('modal-settings').classList.remove('active'); }

    function openQRMenu() { document.getElementById('modal-qr').classList.add('active'); }
    function closeQRModal() { 
        document.getElementById('modal-qr').classList.remove('active'); 
        if(html5QrCode) html5QrCode.stop(); 
        document.getElementById('qrcode').innerHTML = "";
    }

    /* --- QR LOGIKA --- */
    function generateQR() {
        document.getElementById('qrcode').innerHTML = "";
        const data = {
            docs: JSON.parse(localStorage.getItem('docs_data') || '[]'),
            entries: JSON.parse(localStorage.getItem('health_entries') || '[]'),
            names: JSON.parse(localStorage.getItem('app_names') || '["Osoba 1", "Osoba 2"]')
        };
        
        // Komprese dat pro QR (zkrácení klíčů by bylo lepší, ale pro začátek stačí JSON)
        const strData = JSON.stringify(data);
        
        new QRCode(document.getElementById("qrcode"), {
            text: strData,
            width: 256,
            height: 256,
            correctLevel : QRCode.CorrectLevel.L // Nízká korekce chyb umožní více dat
        });
    }

    function startScanner() {
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                importData(decodedText);
                html5QrCode.stop();
            }
        ).catch(err => alert("Chyba kamery: " + err));
    }

    function importData(jsonStr) {
        try {
            const data = JSON.parse(jsonStr);
            if(!confirm("Byla nalezena data. Chcete je PŘIDAT k vašim stávajícím záznamům?")) return;

            // Sloučení lékařů (podle jména, aby nebyly duplicity)
            let oldDocs = JSON.parse(localStorage.getItem('docs_data') || '[]');
            data.docs.forEach(newDoc => {
                if(!oldDocs.find(d => d.name === newDoc.name)) oldDocs.push(newDoc);
            });
            localStorage.setItem('docs_data', JSON.stringify(oldDocs));

            // Sloučení záznamů (podle ID)
            let oldEntries = JSON.parse(localStorage.getItem('health_entries') || '[]');
            data.entries.forEach(newE => {
                if(!oldEntries.find(e => e.id === newE.id)) oldEntries.push(newE);
            });
            localStorage.setItem('health_entries', JSON.stringify(oldEntries));

            alert("Data byla úspěšně importována!");
            location.reload();
        } catch(e) {
            alert("Neplatný QR kód nebo příliš mnoho dat.");
        }
    }

    /* --- ZBYTEK APLIKACE --- */
    function initApp() {
        if(!localStorage.getItem('docs_data')) {
            localStorage.setItem('docs_data', JSON.stringify([
                {id: 1, name: "Zubař", icon: "🦷", color: "#e74c3c"}, 
                {id: 2, name: "Oční", icon: "👁️", color: "#3498db"}
            ]));
        }
        const now = new Date();
        document.getElementById('date-input').valueAsDate = now;
        document.getElementById('time-input').value = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        renderTags(); renderList(); loadSettings();
    }

    function renderTags() {
        const area = document.getElementById('tags-area');
        const modalList = document.getElementById('modal-docs-list');
        const docs = JSON.parse(localStorage.getItem('docs_data') || '[]');
        area.innerHTML = ''; modalList.innerHTML = '';

        docs.forEach((doc) => {
            const t = document.createElement('div'); 
            t.className = 'tag'; t.style.borderColor = doc.color;
            t.innerHTML = `<span>${doc.icon}</span><div class="tag-name">${escapeHTML(doc.name)}</div>`;
            t.onclick = () => { 
                document.getElementById('doctor-input').value = doc.name; 
                document.getElementById('color-input').value = doc.color;
            };
            area.appendChild(t);

            const mRow = document.createElement('div');
            mRow.className = 'modal-doc-item';
            mRow.innerHTML = `<span>${doc.icon} ${escapeHTML(doc.name)}</span><span style="color:var(--danger); cursor:pointer;" onclick="deleteDoctor(event, ${doc.id})">🗑️</span>`;
            modalList.appendChild(mRow);
        });
    }

    function saveEntry() {
        const doc = document.getElementById('doctor-input').value;
        if(!doc) return alert("Vyberte lékaře!");
        const entries = JSON.parse(localStorage.getItem('health_entries') || '[]');
        entries.push({ 
            id: Date.now(), 
            person: document.getElementById('person-select').value, 
            date: document.getElementById('date-input').value, 
            time: document.getElementById('time-input').value, 
            doctor: doc, 
            note: document.getElementById('note-input').value, 
            color: document.getElementById('color-input').value 
        });
        localStorage.setItem('health_entries', JSON.stringify(entries));
        document.getElementById('note-input').value = '';
        renderList();
    }

    function renderList() {
        const container = document.getElementById('main-list');
        let entries = JSON.parse(localStorage.getItem('health_entries') || '[]');
        container.innerHTML = '';
        entries.sort((a,b) => new Date(b.date + 'T' + b.time) - new Date(a.date + 'T' + a.time));
        let lastMonth = "";
        entries.forEach(e => {
            const dateObj = new Date(e.date);
            const currentMonth = dateObj.toLocaleString('cs-CZ', { month: 'long', year: 'numeric' });
            if (currentMonth !== lastMonth) {
                const mHeader = document.createElement('div'); mHeader.className = 'month-header';
                mHeader.textContent = currentMonth; container.appendChild(mHeader);
                lastMonth = currentMonth;
            }
            const div = document.createElement('div'); 
            div.className = 'entry'; div.style.borderLeftColor = e.color;
            div.innerHTML = `<div class="trash-btn" onclick="deleteEntry(${e.id})">🗑️</div>
                <div style="font-size:11px; opacity:0.6">${escapeHTML(e.person)} • ${dateObj.toLocaleDateString('cs-CZ')}</div>
                <div style="font-size:17px; font-weight:900;">${escapeHTML(e.doctor)}</div>
                <div style="font-size:13px; opacity:0.8;">${escapeHTML(e.note)}</div>`;
            container.appendChild(div);
        });
    }

    function addDoctor() {
        const name = document.getElementById('new-doc-name').value.trim();
        if(!name) return;
        const docs = JSON.parse(localStorage.getItem('docs_data') || '[]');
        docs.push({ id: Date.now(), name, icon: document.getElementById('new-doc-icon').value, color: document.getElementById('new-doc-color').value });
        localStorage.setItem('docs_data', JSON.stringify(docs));
        renderTags();
    }

    function deleteDoctor(e, id) { e.stopPropagation(); let docs = JSON.parse(localStorage.getItem('docs_data') || '[]'); docs = docs.filter(d => d.id !== id); localStorage.setItem('docs_data', JSON.stringify(docs)); renderTags(); }
    function deleteEntry(id) { if(confirm("Smazat?")) { let e = JSON.parse(localStorage.getItem('health_entries') || '[]'); localStorage.setItem('health_entries', JSON.stringify(e.filter(x => x.id !== id))); renderList(); } }
    function loadSettings() {
        const names = JSON.parse(localStorage.getItem('app_names') || '["Osoba 1", "Osoba 2"]');
        document.getElementById('person-select').innerHTML = `<option>${names[0]}</option><option>${names[1]}</option>`;
        document.getElementById('p1-name').value = names[0]; document.getElementById('p2-name').value = names[1];
    }
    function updateNames() { localStorage.setItem('app_names', JSON.stringify([document.getElementById('p1-name').value, document.getElementById('p2-name').value])); loadSettings(); alert("Uloženo"); }
    function clearData() { if(confirm("Smazat vše?")) { localStorage.clear(); location.reload(); } }
</script>
</body>
</html>
