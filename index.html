<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chytrý Lékařský Zápisník</title>
    <style>
        :root { --p: #007bff; --bg: #f4f7f6; --danger: #e74c3c; --success: #2ecc71; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .app-container { width: 100%; max-width: 500px; }
        
        .controls { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; margin-bottom: 20px; border: 2px solid #eee; }
        
        #mic-btn { 
            background: var(--danger); color: white; border: none; 
            width: 80px; height: 80px; border-radius: 50%; font-size: 30px; 
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; margin: 0 auto;
        }
        
        #mic-btn.recording { background: var(--success); transform: scale(1.1); box-shadow: 0 0 20px rgba(46, 204, 113, 0.4); }

        #status { margin-top: 15px; font-size: 0.9rem; color: #666; line-height: 1.4; }
        .hint { font-size: 0.75rem; color: #999; margin-top: 5px; }

        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-top: 4px solid var(--p); position: relative; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full { grid-column: span 2; }
        
        label { display: block; font-size: 10px; font-weight: bold; color: var(--p); text-transform: uppercase; margin-top: 10px; }
        input { width: 100%; border: 1px solid #ddd; padding: 8px; border-radius: 6px; font-size: 14px; box-sizing: border-box; background: #fdfdfd; }
        input:focus { border-color: var(--p); outline: none; background: #fff; }
        
        .btn-delete { position: absolute; top: 10px; right: 10px; border: none; background: none; color: #eee; font-size: 18px; cursor: pointer; }
        .btn-delete:hover { color: var(--danger); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="controls">
        <button id="mic-btn">🎤</button>
        <div id="status">Klepni a řekni např.:<br><b>"Jan Novák doktor Svoboda 12. března v 15:30 kontrola krve"</b></div>
        <div class="hint">Tlačítkem nahrávání spustíš i zastavíš.</div>
    </div>

    <div id="list"></div>
</div>

<script>
    const micBtn = document.getElementById('mic-btn');
    const status = document.getElementById('status');
    const list = document.getElementById('list');

    let appointments = JSON.parse(localStorage.getItem('med_table_data') || '[]');
    let isRecording = false;

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (SpeechRec) {
        const recognition = new SpeechRec();
        recognition.lang = 'cs-CZ';
        recognition.continuous = false;

        micBtn.onclick = () => {
            if (!isRecording) recognition.start();
            else recognition.stop();
        };

        recognition.onstart = () => {
            isRecording = true;
            micBtn.classList.add('recording');
            micBtn.innerHTML = "⏹️";
            status.innerText = "Teď mluvte...";
        };

        recognition.onresult = (e) => {
            const text = e.results[0][0].transcript;
            processSmartData(text);
        };

        recognition.onend = () => {
            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.innerHTML = "🎤";
            status.innerHTML = "Uloženo. Klepni pro další zadání.";
        };
    }

    function processSmartData(text) {
        // Pomocná logika pro rozdělení textu
        const lowerText = text.toLowerCase();
        
        // 1. Hledání ČASU (např. 15:30 nebo 15 hodin)
        const timeMatch = text.match(/(\d{1,2}[:\.]\d{2})/) || text.match(/(\d{1,2})\s*(hodin|hod)/);
        const foundTime = timeMatch ? timeMatch[1].replace('.', ':') : "";

        // 2. Hledání DATUMU (např. 12.5. nebo 12. května)
        const dateMatch = text.match(/(\d{1,2}\.\s?(\d{1,2}\.|[a-záíěéúů]{3,}))/i);
        const foundDate = dateMatch ? dateMatch[0] : "";

        // 3. Hledání LÉKAŘE (pokud řekneš "doktor", "mudr" nebo "lékař")
        let doctor = "";
        const docKeywords = ["doktor", "doktorka", "mudr", "lékař", "u doktora"];
        docKeywords.forEach(kw => {
            if (lowerText.includes(kw)) {
                const parts = text.split(new RegExp(kw, 'i'));
                if (parts[1]) doctor = parts[1].trim().split(' ')[0]; // Vezme první slovo za klíčem
            }
        });

        // 4. JMÉNO (předpokládáme, že první dvě slova jsou jméno, pokud to není datum)
        const words = text.split(' ');
        const name = (words[0] + " " + (words[1] || "")).trim();

        const entry = {
            id: Date.now(),
            name: name,
            doctor: doctor || "Neuvedeno",
            date: foundDate,
            time: foundTime,
            note: text // Celý text pro jistotu do poznámky
        };

        appointments.unshift(entry);
        save();
    }

    function update(id, field, value) {
        appointments = appointments.map(a => a.id === id ? {...a, [field]: value} : a);
        localStorage.setItem('med_table_data', JSON.stringify(appointments));
    }

    function remove(id) {
        appointments = appointments.filter(a => a.id !== id);
        save();
    }

    function save() {
        localStorage.setItem('med_table_data', JSON.stringify(appointments));
        render();
    }

    function render() {
        list.innerHTML = appointments.map(a => `
            <div class="card">
                <button class="btn-delete" onclick="remove(${a.id})">✕</button>
                
                <div class="grid">
                    <div class="full">
                        <label>Pacient (Jméno)</label>
                        <input type="text" value="${a.name}" oninput="update(${a.id}, 'name', this.value)">
                    </div>
                    <div class="full">
                        <label>Lékař</label>
                        <input type="text" value="${a.doctor}" oninput="update(${a.id}, 'doctor', this.value)">
                    </div>
                    <div>
                        <label>Datum</label>
                        <input type="text" value="${a.date}" placeholder="12.10." oninput="update(${a.id}, 'date', this.value)">
                    </div>
                    <div>
                        <label>Čas</label>
                        <input type="text" value="${a.time}" placeholder="14:00" oninput="update(${a.id}, 'time', this.value)">
                    </div>
                    <div class="full">
                        <label>Poznámka / Celý záznam</label>
                        <input type="text" value="${a.note}" oninput="update(${a.id}, 'note', this.value)">
                    </div>
                </div>
            </div>
        `).join('');
    }

    render();
</script>

</body>
</html>
