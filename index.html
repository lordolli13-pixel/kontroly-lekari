<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lékařský Zápisník - Oprava data</title>
    <style>
        :root { --p: #007bff; --bg: #f0f4f8; --danger: #e74c3c; --success: #2ecc71; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .app-container { width: 100%; max-width: 500px; }
        
        .controls { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; margin-bottom: 20px; }
        
        #mic-btn { 
            background: var(--danger); color: white; border: none; 
            width: 80px; height: 80px; border-radius: 50%; font-size: 30px; 
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; margin: 0 auto;
        }
        
        #mic-btn.recording { background: var(--success); box-shadow: 0 0 20px rgba(46, 204, 113, 0.5); transform: scale(1.05); }

        #status { margin-top: 15px; font-weight: 600; color: #444; min-height: 40px; font-size: 0.9rem; }

        .card { background: white; padding: 18px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 6px solid var(--p); position: relative; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        
        label { display: block; font-size: 11px; font-weight: bold; color: var(--p); text-transform: uppercase; margin-bottom: 4px; }
        input { width: 100%; border: 1px solid #ddd; padding: 10px; border-radius: 8px; font-size: 15px; box-sizing: border-box; background: #fafafa; }
        input:focus { border-color: var(--p); outline: none; background: #fff; }
        
        .btn-delete { position: absolute; top: 10px; right: 10px; border: none; background: none; color: #ccc; font-size: 20px; cursor: pointer; }
        .btn-delete:hover { color: var(--danger); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="controls">
        <button id="mic-btn">🎤</button>
        <div id="status">Klepni a řekni např.:<br>"Petr Malý doktor Novák 20. 5. ve 14:00 kontrola"</div>
    </div>

    <div id="list"></div>
</div>

<script>
    const micBtn = document.getElementById('mic-btn');
    const status = document.getElementById('status');
    const list = document.getElementById('list');

    let appointments = JSON.parse(localStorage.getItem('med_v3_data') || '[]');
    let isRecording = false;

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (SpeechRec) {
        const recognition = new SpeechRec();
        recognition.lang = 'cs-CZ';

        micBtn.onclick = () => {
            if (!isRecording) recognition.start();
            else recognition.stop();
        };

        recognition.onstart = () => {
            isRecording = true;
            micBtn.classList.add('recording');
            micBtn.innerHTML = "⏹️";
            status.innerText = "Poslouchám... Mluvte přirozeně.";
        };

        recognition.onresult = (e) => {
            const text = e.results[0][0].transcript;
            status.innerText = "Zpracovávám: " + text;
            processData(text);
        };

        recognition.onend = () => {
            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.innerHTML = "🎤";
        };
    }

    function processData(text) {
        const lowerText = text.toLowerCase();

        // --- LEPŠÍ HLEDÁNÍ DATUMU ---
        // Hledá vzory: "12.5.", "12. 5.", "12. května", "12. 10. 2024"
        const dateRegex = /(\d{1,2}\.\s?(\d{1,2}\.?|[a-záíěéúů]{3,}))/i;
        const dateMatch = text.match(dateRegex);
        const foundDate = dateMatch ? dateMatch[0].trim() : "";

        // --- HLEDÁNÍ ČASU ---
        // Hledá vzory: "15:30", "15.30", "v 10 hodin"
        const timeRegex = /(\d{1,2}[:\.]\d{2})/;
        const timeMatch = text.match(timeRegex);
        const foundTime = timeMatch ? timeMatch[1].replace('.', ':') : "";

        // --- HLEDÁNÍ LÉKAŘE ---
        let doctor = "";
        const docKeywords = ["doktor", "doktorka", "lékař", "mudr"];
        for (let kw of docKeywords) {
            if (lowerText.includes(kw)) {
                const parts = text.split(new RegExp(kw, 'i'));
                if (parts[1]) doctor = parts[1].trim().split(' ')[0]; 
                break;
            }
        }

        // --- JMÉNO ---
        // První dvě slova, pokud to není datum
        const words = text.split(' ');
        let name = words[0];
        if (words[1] && !words[1].includes('.')) name += " " + words[1];

        const entry = {
            id: Date.now(),
            name: name,
            doctor: doctor || "",
            date: foundDate,
            time: foundTime,
            note: text
        };

        appointments.unshift(entry);
        save();
    }

    function update(id, field, value) {
        appointments = appointments.map(a => a.id === id ? {...a, [field]: value} : a);
        localStorage.setItem('med_v3_data', JSON.stringify(appointments));
    }

    function remove(id) {
        appointments = appointments.filter(a => a.id !== id);
        save();
    }

    function save() {
        localStorage.setItem('med_v3_data', JSON.stringify(appointments));
        render();
    }

    function render() {
        list.innerHTML = appointments.map(a => `
            <div class="card">
                <button class="btn-delete" onclick="remove(${a.id})">✕</button>
                <div class="grid">
                    <div class="full">
                        <label>Pacient</label>
                        <input type="text" value="${a.name}" oninput="update(${a.id}, 'name', this.value)">
                    </div>
                    <div class="full">
                        <label>Lékař</label>
                        <input type="text" value="${a.doctor}" oninput="update(${a.id}, 'doctor', this.value)">
                    </div>
                    <div>
                        <label>Datum</label>
                        <input type="text" value="${a.date}" placeholder="např. 12. 5." oninput="update(${a.id}, 'date', this.value)">
                    </div>
                    <div>
                        <label>Čas</label>
                        <input type="text" value="${a.time}" placeholder="15:00" oninput="update(${a.id}, 'time', this.value)">
                    </div>
                    <div class="full">
                        <label>Poznámka</label>
                        <input type="text" value="${a.note}" oninput="update(${a.id}, 'note', this.value)">
                    </div>
                </div>
            </div>
        `).join('');
    }

    render();
</script>

</body>
</html>
