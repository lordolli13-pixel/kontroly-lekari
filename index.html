<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" id="theme-meta" content="#1e2124">
    <title>Deník Zdraví PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style id="custom-theme-styles">
        :root {
            --bg: #1e2124; --box-bg: #1e2124; --light-shadow: #2a2e33; --dark-shadow: #121416;
            --accent: #ff9f43; --text-main: #ffffff; --text-dim: #b0b0b0;
            --border-amber: rgba(255, 159, 67, 0.4); --danger: #ff4d4d; --whatsapp: #25d366; --input-bg: #1e2124;
            --overlay: rgba(0, 0, 0, 0.9);
        }
        [data-theme="light"] {
            --bg: #e0e5ec; --box-bg: #e0e5ec; --light-shadow: #ffffff; --dark-shadow: #a3b1c6;
            --accent: #e67e22; --text-main: #2c3e50; --text-dim: #7f8c8d;
            --border-amber: rgba(230, 126, 34, 0.4); --danger: #e74c3c; --whatsapp: #27ae60; --input-bg: #e0e5ec;
            --overlay: rgba(255, 255, 255, 0.9);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, system-ui, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 12px; transition: background 0.3s ease; font-weight: 600; overflow-x: hidden; }
        .container { width: 100%; max-width: 450px; margin: auto; }
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h2 { margin: 0; font-weight: 900; color: var(--accent); text-transform: uppercase; font-size: 16px; }
        .top-icons { display: flex; gap: 10px; }
        .icon-btn { width: 42px; height: 42px; border-radius: 12px; background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 8px var(--dark-shadow), -4px -4px 8px var(--light-shadow); border: 1px solid var(--border-amber); font-size: 18px; transition: 0.2s; }
        .icon-btn:active { transform: scale(0.9); }
        .neu-box { background: var(--box-bg); border-radius: 20px; padding: 15px; box-shadow: 6px 6px 12px var(--dark-shadow), -6px -6px 12px var(--light-shadow); border: 1px solid var(--border-amber); margin-bottom: 20px; }
        input, select { width: 100%; border: 1px solid var(--border-amber); outline: none; background: var(--input-bg); padding: 12px; border-radius: 12px; box-shadow: inset 3px 3px 6px var(--dark-shadow); margin-bottom: 10px; font-size: 16px; color: var(--text-main); font-weight: 700; }
        .btn { background: var(--bg); border: 2px solid var(--border-amber); border-radius: 12px; padding: 15px; font-weight: 900; color: var(--accent); box-shadow: 3px 3px 6px var(--dark-shadow), -3px -3px 6px var(--light-shadow); cursor: pointer; text-align: center; text-transform: uppercase; font-size: 14px; width: 100%; display: block; margin-bottom: 10px; transition: 0.2s; }
        .btn:active { transform: scale(0.96); box-shadow: inset 2px 2px 5px var(--dark-shadow); }
        .filter-bar { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding: 5px 2px; scrollbar-width: none; }
        .filter-btn { padding: 8px 15px; border-radius: 10px; font-size: 11px; background: var(--bg); border: 1px solid var(--border-amber); color: var(--text-dim); cursor: pointer; white-space: nowrap; font-weight: 800; transition: 0.2s; }
        .filter-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
        .tags-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; max-height: 250px; overflow-y: auto; padding: 10px 5px; background: rgba(0,0,0,0.1); border-radius: 15px; }
        .tag { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; border-radius: 15px; box-shadow: 3px 3px 6px var(--dark-shadow), -3px -3px 6px var(--light-shadow); cursor: pointer; border: 2px solid transparent; text-align: center; min-height: 75px; transition: 0.2s; background: var(--bg); }
        .tag span { font-size: 24px; margin-bottom: 4px; }
        .month-header { background: var(--accent); color: var(--bg); padding: 4px 12px; border-radius: 6px; font-weight: 900; text-transform: uppercase; font-size: 10px; display: inline-block; margin: 15px 0 10px 0; }
        .entry { background: var(--box-bg); padding: 15px; border-radius: 18px; margin-bottom: 12px; box-shadow: 4px 4px 10px var(--dark-shadow); position: relative; border-left: 5px solid var(--accent); width: 100%; }
        .trash-btn { position: absolute; right: 10px; top: 10px; color: var(--danger); cursor: pointer; font-size: 20px; opacity: 0.7; z-index: 5; }
        .entry-share-bar { display: flex; gap: 8px; margin-top: 12px; border-top: 1px solid var(--border-amber); padding-top: 10px; }
        .share-btn { flex: 1; padding: 8px; border-radius: 8px; font-size: 10px; text-transform: uppercase; font-weight: 800; text-align: center; border: 1px solid var(--border-amber); color: var(--text-dim); cursor: pointer; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(8px); }
        .modal-overlay.active { display: flex; }
        .modal-content { width: 95%; max-width: 400px; max-height: 90vh; overflow-y: auto; position: relative; }
        #qrcode canvas { max-width: 100% !important; height: auto !important; border-radius: 10px; margin: 0 auto; }
    </style>
</head>
<body data-theme="dark">

<div class="container">
    <div class="header-area">
        <h2>🩺 Zdraví PRO</h2>
        <div class="top-icons">
            <div class="icon-btn" onclick="requestNotificationPermission()" title="Zapnout notifikace">🔔</div>
            <div class="icon-btn" onclick="toggleTheme()">☀️</div>
            <div class="icon-btn" onclick="openPalette()">🎨</div>
            <div class="icon-btn" onclick="openQRMenu()">📲</div>
            <div class="icon-btn" onclick="openModal()">⚙️</div>
        </div>
    </div>

    <div class="neu-box">
        <div class="tags-grid" id="tags-area"></div>
        <select id="person-select"></select>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
            <input type="date" id="date-input" style="flex: 1.2; margin: 0;">
            <input type="time" id="time-input" style="flex: 0.8; margin: 0;">
        </div>
        <input type="text" id="doctor-input" placeholder="Lékař / Ambulance">
        <input type="hidden" id="color-input" value="#ff9f43">
        <input type="text" id="note-input" placeholder="Poznámka...">
        <div class="btn" id="save-btn" onclick="saveEntry()">Uložit záznam</div>
    </div>

    <div id="stats-area" style="display: flex; gap: 10px; margin-bottom: 15px;"></div>

    <div class="filter-bar" id="filter-bar">
        <div class="filter-btn active" onclick="setFilter('ALL', this)">Všechny</div>
        <div class="filter-btn" id="filter-p1" onclick="setFilter('P1', this)">Osoba 1</div>
        <div class="filter-btn" id="filter-p2" onclick="setFilter('P2', this)">Osoba 2</div>
    </div>

    <div id="main-list"></div>
</div>

<div class="modal-overlay" id="modal-qr">
    <div class="modal-content">
        <div class="neu-box" style="text-align:center;">
            <h4 id="qr-title" style="color: var(--accent); margin-top:0;">QR KÓD ÚKOLU</h4>
            <div id="qrcode-container" style="display: none; justify-content: center; background: white; padding: 15px; border-radius: 15px; margin-bottom: 15px;">
                <div id="qrcode"></div>
            </div>
            <div id="reader-container" style="display: none;">
                <div id="reader" style="width: 100%;"></div>
            </div>
            <div class="btn" id="scan-trigger-btn" onclick="startScanner()">Naskenovat kód z jiného mobilu</div>
            <div class="btn" onclick="closeQRModal()" style="border: none; opacity: 0.6; margin-top: 10px;">Zavřít</div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-settings">
    <div class="modal-content">
        <div class="neu-box">
            <h4 style="color: var(--accent);">SPRÁVA LÉKAŘŮ</h4>
            <div id="modal-docs-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 10px;"></div>
            <hr>
            <input type="text" id="new-doc-name" placeholder="Název lékaře">
            <select id="new-doc-icon">
                <option value="🩺">🩺 Praktik</option>
                <option value="🦷">🦷 Zubař</option>
                <option value="❤️">❤️ Kardiologie</option>
                <option value="🩹">🩹 Chirurgie</option>
                <option value="💉">💉 Očkování</option>
                <option value="👁️">👁️ Oční</option>
                <option value="👂">👂 ORL</option>
                <option value="🦴">🦴 Ortopedie</option>
                <option value="🧠">🧠 Neurologie</option>
                <option value="🧴">🧴 Kožní</option>
                <option value="🤰">🤰 Gynekologie</option>
                <option value="👶">👶 Pediatrie</option>
                <option value="🍏">🍏 Nutrice</option>
                <option value="🧪">🧪 Laboratoř</option>
                <option value="🩻">🩻 RTG / Rentgen</option>
            </select>
            <input type="color" id="new-doc-color" value="#ff9f43" style="height:45px">
            <div class="btn" onclick="addDoctor()">Přidat lékaře</div>
            <div class="btn" onclick="clearDoctors()" style="color:var(--danger); border-color:var(--danger); font-size:10px;">Smazat všechny lékaře</div>
            <hr>
            <h4>PACIENTI</h4>
            <input type="text" id="p1-name-input" placeholder="Jméno 1">
            <input type="text" id="p2-name-input" placeholder="Jméno 2">
            <div class="btn" onclick="updateNames()">Uložit jména</div>
            <div class="btn" onclick="closeModal()" style="border: none; opacity: 0.6;">Zavřít</div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-palette">
    <div class="modal-content">
        <div class="neu-box">
            <h4 style="color: var(--accent);">BAREVNÉ SCHÉMA</h4>
            <div style="display:grid; gap:10px;">
                <label style="font-size:12px;">Barva akcentu: <input type="color" id="cfg-accent" onchange="updateAppColors()"></label>
                <label style="font-size:12px;">Barva pozadí: <input type="color" id="cfg-bg" onchange="updateAppColors()"></label>
                <label style="font-size:12px;">Barva textu: <input type="color" id="cfg-text" onchange="updateAppColors()"></label>
            </div>
            <div class="btn" onclick="resetColors()" style="margin-top:15px;">Resetovat barvy</div>
            <div class="btn" onclick="closePalette()" style="border: none; opacity: 0.6;">Zavřít</div>
        </div>
    </div>
</div>

<script>
    let currentFilter = 'ALL';
    let html5QrCode;
    let editingId = null;

    const getLS = (key, def = '[]') => JSON.parse(localStorage.getItem(key) || def);
    const setLS = (key, val) => localStorage.setItem(key, JSON.stringify(val));

    document.addEventListener('DOMContentLoaded', () => {
        applySavedColors();
        setTheme(localStorage.getItem('theme') || 'dark');
        initApp();
    });

    function requestNotificationPermission() {
        if (!("Notification" in window)) {
            alert("Tento prohlížeč nepodporuje notifikace.");
            return;
        }
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                new Notification("Zdraví PRO", { body: "Notifikace byly aktivovány!", icon: "🩺" });
            }
        });
    }

    function scheduleNotification(entry) {
        if (Notification.permission !== "granted") return;
        
        const targetTime = new Date(entry.date + 'T' + entry.time).getTime();
        const now = new Date().getTime();
        
        // 1. Notifikace v den a čas schůzky
        const diffNow = targetTime - now;
        if (diffNow > 0) {
            setTimeout(() => {
                new Notification(`DNES: ${entry.doctor}`, {
                    body: `Právě teď máte termín.\nPacient: ${entry.person}`,
                    icon: "🩺"
                });
            }, diffNow);
        }

        // 2. Notifikace přesně 24 hodin předem
        const oneDayInMs = 24 * 60 * 60 * 1000;
        const diffDayBefore = targetTime - oneDayInMs - now;
        if (diffDayBefore > 0) {
            setTimeout(() => {
                new Notification(`ZÍTRA: ${entry.doctor}`, {
                    body: `Zítra v ${entry.time} máte termín.\nPacient: ${entry.person}`,
                    icon: "🩺"
                });
            }, diffDayBefore);
        }
    }

    function initApp() {
        if(!localStorage.getItem('docs_data') || getLS('docs_data').length < 5) {
            const initialDocs = [
                {id: 1, name: "Praktik", icon: "🩺", color: "#3498db"},
                {id: 2, name: "Zubař", icon: "🦷", color: "#f1c40f"},
                {id: 3, name: "Kardiologie", icon: "❤️", color: "#e74c3c"},
                {id: 4, name: "Chirurgie", icon: "🩹", color: "#95a5a6"},
                {id: 5, name: "Očkování", icon: "💉", color: "#2ecc71"},
                {id: 6, name: "Oční", icon: "👁️", color: "#1abc9c"},
                {id: 7, name: "ORL", icon: "👂", color: "#d35400"},
                {id: 8, name: "Ortopedie", icon: "🦴", color: "#7f8c8d"},
                {id: 9, name: "Neurologie", icon: "🧠", color: "#9b59b6"},
                {id: 10, name: "Kožní", icon: "🧴", color: "#e67e22"},
                {id: 11, name: "Gynekologie", icon: "🤰", color: "#fd79a8"},
                {id: 12, name: "Pediatrie", icon: "👶", color: "#74b9ff"},
                {id: 13, name: "Nutrice", icon: "🍏", color: "#55efc4"},
                {id: 14, name: "Laboratoř", icon: "🧪", color: "#a29bfe"},
                {id: 15, name: "Rentgen", icon: "🩻", color: "#dfe6e9"},
                {id: 16, name: "Psychologie", icon: "🗣️", color: "#6c5ce7"},
                {id: 17, name: "Urologie", icon: "💧", color: "#0984e3"},
                {id: 18, name: "Rehabilitace", icon: "🧘", color: "#fab1a0"},
                {id: 19, name: "Lékárna", icon: "💊", color: "#badc58"},
                {id: 20, name: "Pohotovost", icon: "🚨", color: "#ff7675"},
                {id: 21, name: "Endokrinolog", icon: "🦋", color: "#ff9ff3"},
                {id: 22, name: "Alergologie", icon: "🤧", color: "#feca57"},
                {id: 23, name: "Gastro", icon: "🍕", color: "#ff6b6b"},
                {id: 24, name: "Plicní", icon: "🫁", color: "#48dbfb"},
                {id: 25, name: "Infekční", icon: "🦠", color: "#1dd1a1"},
                {id: 26, name: "Diabetologie", icon: "🍭", color: "#ff9f43"},
                {id: 27, name: "Onkologie", icon: "🎗️", color: "#f368e0"},
                {id: 28, name: "Sanitka", icon: "🚑", color: "#ee5253"},
                {id: 29, name: "Nemocnice", icon: "🏥", color: "#54a0ff"},
                {id: 30, name: "Spánek", icon: "😴", color: "#222f3e"}
            ];
            setLS('docs_data', initialDocs);
        }
        resetInputs();
        renderTags();
        loadSettings();
        renderList();
    }

    function resetInputs() {
        const now = new Date();
        document.getElementById('date-input').valueAsDate = now;
        document.getElementById('time-input').value = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        document.getElementById('doctor-input').value = '';
        document.getElementById('note-input').value = '';
        document.getElementById('save-btn').textContent = "Uložit záznam";
        editingId = null;
    }

    function saveEntry() {
        const doc = document.getElementById('doctor-input').value.trim();
        const date = document.getElementById('date-input').value;
        if(!doc || !date) return alert("Doplňte lékaře a datum!");
        let entries = getLS('health_entries');
        const entry = {
            id: editingId || (Date.now() + "_" + Math.random().toString(36).substr(2, 5)),
            person: document.getElementById('person-select').value,
            date: date,
            time: document.getElementById('time-input').value,
            doctor: doc,
            note: document.getElementById('note-input').value.trim(),
            color: document.getElementById('color-input').value
        };
        if(editingId) {
            entries = entries.map(e => String(e.id) === String(editingId) ? entry : e);
        } else {
            entries.push(entry);
        }
        setLS('health_entries', entries);
        scheduleNotification(entry);
        resetInputs();
        renderList();
        const btn = document.getElementById('save-btn');
        btn.style.background = "var(--whatsapp)";
        setTimeout(() => btn.style.background = "var(--bg)", 500);
    }

    function renderList() {
        const container = document.getElementById('main-list');
        let entries = getLS('health_entries');
        const names = getLS('app_names', '["Osoba 1", "Osoba 2"]');
        container.innerHTML = '';
        updateStats(entries);
        if(currentFilter === 'P1') entries = entries.filter(e => e.person === names[0]);
        if(currentFilter === 'P2') entries = entries.filter(e => e.person === names[1]);
        entries.sort((a,b) => new Date(b.date + 'T' + b.time) - new Date(a.date + 'T' + a.time));
        let lastMonth = "";
        entries.forEach(e => {
            const dateObj = new Date(e.date);
            const m = dateObj.toLocaleString('cs-CZ', { month: 'long', year: 'numeric' });
            if (m !== lastMonth) {
                const h = document.createElement('div'); h.className = 'month-header';
                h.textContent = m; container.appendChild(h); lastMonth = m;
            }
            const div = document.createElement('div');
            div.className = 'entry';
            div.style.borderLeftColor = e.color;
            div.innerHTML = `
                <div class="trash-btn" onclick="deleteEntry('${e.id}')">🗑️</div>
                <div style="font-size:10px; opacity:0.6">${e.person} • ${dateObj.toLocaleDateString('cs-CZ')}</div>
                <div style="font-size:16px; font-weight:900; margin: 3px 0; cursor:pointer;" onclick="editEntry('${e.id}')">${e.doctor}</div>
                <div style="font-size:13px; opacity:0.8;">${e.note || ''}</div>
                <div class="entry-share-bar">
                    <div class="share-btn" onclick="shareWhatsApp('${e.id}')" style="color:var(--whatsapp)">WhatsApp</div>
                    <div class="share-btn" onclick='generateTaskQR(${JSON.stringify(e)})'>QR Sdílet</div>
                    <div class="share-btn" onclick="editEntry('${e.id}')">Upravit</div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function deleteEntry(id) {
        if(!confirm("Opravdu smazat tento záznam?")) return;
        let entries = getLS('health_entries');
        const filtered = entries.filter(x => String(x.id) !== String(id));
        setLS('health_entries', filtered);
        renderList();
    }

    function editEntry(id) {
        const e = getLS('health_entries').find(x => String(x.id) === String(id));
        if(!e) return;
        editingId = e.id;
        document.getElementById('doctor-input').value = e.doctor;
        document.getElementById('note-input').value = e.note;
        document.getElementById('date-input').value = e.date;
        document.getElementById('time-input').value = e.time;
        document.getElementById('person-select').value = e.person;
        document.getElementById('color-input').value = e.color;
        document.getElementById('save-btn').textContent = "Aktualizovat";
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function generateTaskQR(entryData) {
        if (!entryData) return;
        const taskData = { ...entryData, type: "SINGLE_TASK" };
        document.getElementById('modal-qr').classList.add('active');
        document.getElementById('qr-title').textContent = "QR SDÍLENÍ ÚKOLU";
        document.getElementById('qrcode-container').style.display = "flex";
        document.getElementById('reader-container').style.display = "none";
        document.getElementById('scan-trigger-btn').style.display = "none";
        const qrBox = document.getElementById('qrcode');
        qrBox.innerHTML = "";
        new QRCode(qrBox, { text: JSON.stringify(taskData), width: 250, height: 250 });
    }

    function startScanner() {
        document.getElementById('qr-title').textContent = "SKENOVÁNÍ...";
        document.getElementById('qrcode-container').style.display = "none";
        document.getElementById('reader-container').style.display = "block";
        document.getElementById('scan-trigger-btn').style.display = "none";
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
            try {
                const data = JSON.parse(text);
                if(data.type === "SINGLE_TASK") {
                    let entries = getLS('health_entries');
                    const newEntry = { ...data, id: "qr_" + Date.now() };
                    delete newEntry.type; 
                    entries.push(newEntry);
                    setLS('health_entries', entries);
                    html5QrCode.stop().then(() => {
                        alert("Záznam přijat!");
                        closeQRModal();
                        renderList();
                    });
                }
            } catch(e) { alert("Neplatný QR kód."); }
        }).catch(() => alert("Kamera nedostupná."));
    }

    function addDoctor() {
        const name = document.getElementById('new-doc-name').value.trim();
        if(!name) return;
        let docs = getLS('docs_data');
        docs.push({
            id: Date.now(),
            name: name,
            icon: document.getElementById('new-doc-icon').value,
            color: document.getElementById('new-doc-color').value
        });
        setLS('docs_data', docs);
        document.getElementById('new-doc-name').value = '';
        renderTags();
    }

    function clearDoctors() {
        if(confirm("Opravdu smazat všechny přednastavené lékaře?")) {
            localStorage.removeItem('docs_data');
            location.reload();
        }
    }

    function renderTags() {
        const area = document.getElementById('tags-area');
        const docs = getLS('docs_data');
        area.innerHTML = '';
        docs.forEach(doc => {
            const t = document.createElement('div'); t.className = 'tag'; t.style.borderColor = doc.color;
            t.innerHTML = `<span>${doc.icon}</span><div style="font-size:10px; font-weight:bold;">${doc.name}</div>`;
            t.onclick = () => {
                document.getElementById('doctor-input').value = doc.name;
                document.getElementById('color-input').value = doc.color;
                document.querySelectorAll('.tag').forEach(tag => tag.style.background = "var(--bg)");
                t.style.background = "rgba(255,159,67,0.2)";
            };
            area.appendChild(t);
        });
    }

    function updateStats(entries) {
        const stats = document.getElementById('stats-area');
        const monthAgo = new Date(); monthAgo.setMonth(monthAgo.getMonth() - 1);
        const recent = entries.filter(e => new Date(e.date) > monthAgo).length;
        stats.innerHTML = `
            <div class="neu-box" style="flex:1; margin:0; padding:10px; text-align:center;">
                <div style="color:var(--accent); font-size:16px;">${entries.length}</div>
                <div style="font-size:8px; opacity:0.6;">CELKEM</div>
            </div>
            <div class="neu-box" style="flex:1; margin:0; padding:10px; text-align:center;">
                <div style="color:var(--accent); font-size:16px;">${recent}</div>
                <div style="font-size:8px; opacity:0.6;">POSLEDNÍ MĚSÍC</div>
            </div>`;
    }

    function updateNames() {
        const p1 = document.getElementById('p1-name-input').value.trim() || "Osoba 1";
        const p2 = document.getElementById('p2-name-input').value.trim() || "Osoba 2";
        setLS('app_names', [p1, p2]);
        location.reload();
    }

    function loadSettings() {
        const n = getLS('app_names', '["Osoba 1", "Osoba 2"]');
        document.getElementById('person-select').innerHTML = `<option>${n[0]}</option><option>${n[1]}</option>`;
        document.getElementById('filter-p1').textContent = n[0];
        document.getElementById('filter-p2').textContent = n[1];
        document.getElementById('p1-name-input').value = n[0];
        document.getElementById('p2-name-input').value = n[1];
    }

    function toggleTheme() { setTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }
    function setTheme(t) { document.body.setAttribute('data-theme', t); localStorage.setItem('theme', t); }
    
    function updateAppColors() {
        const theme = {
            accent: document.getElementById('cfg-accent').value,
            bg: document.getElementById('cfg-bg').value,
            text: document.getElementById('cfg-text').value
        };
        const root = document.documentElement;
        root.style.setProperty('--accent', theme.accent);
        root.style.setProperty('--bg', theme.bg);
        root.style.setProperty('--text-main', theme.text);
        localStorage.setItem('custom_theme', JSON.stringify(theme));
    }

    function resetColors() {
        localStorage.removeItem('custom_theme');
        location.reload();
    }

    function applySavedColors() {
        const saved = localStorage.getItem('custom_theme');
        if(saved) {
            const t = JSON.parse(saved);
            const root = document.documentElement;
            root.style.setProperty('--accent', t.accent);
            root.style.setProperty('--bg', t.bg);
            root.style.setProperty('--text-main', t.text);
            if(document.getElementById('cfg-accent')) {
                document.getElementById('cfg-accent').value = t.accent;
                document.getElementById('cfg-bg').value = t.bg;
                document.getElementById('cfg-text').value = t.text;
            }
        }
    }

    function setFilter(f, btn) { currentFilter = f; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderList(); }
    function openModal() { document.getElementById('modal-settings').classList.add('active'); }
    function closeModal() { document.getElementById('modal-settings').classList.remove('active'); }
    function openPalette() { document.getElementById('modal-palette').classList.add('active'); }
    function closePalette() { document.getElementById('modal-palette').classList.remove('active'); }
    function openQRMenu() { document.getElementById('modal-qr').classList.add('active'); document.getElementById('qr-title').textContent = "PŘÍJEM DAT"; document.getElementById('qrcode-container').style.display = "none"; document.getElementById('reader-container').style.display = "none"; document.getElementById('scan-trigger-btn').style.display = "block"; }
    function closeQRModal() { document.getElementById('modal-qr').classList.remove('active'); if(html5QrCode) html5QrCode.stop().catch(() => {}); }
    function shareWhatsApp(id) {
        const e = getLS('health_entries').find(x => String(x.id) === String(id));
        const text = `*Zdravotní záznam*\nLékař: ${e.doctor}\nDatum: ${e.date}\nPacient: ${e.person}\nPoznámka: ${e.note || '-'}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
    }
</script>
</body>
