<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HealthLog PRO Platinum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #000; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = window.framerMotion;

        // --- KNIHOVNA IKON (INTELIGENCE) ---
        const ICON_MAP = {
            "🦷": ["zub", "dent", "stoma"], "👁️": ["oční", "oko", "optik"], "❤️": ["kardio", "srdce", "tlak"],
            "🩸": ["krev", "odběr", "hemat"], "💉": ["očko", "inj", "vakc"], "🦴": ["orto", "kost", "chir", "rtg"],
            "🧠": ["neuro", "psyc", "hlava"], "👶": ["pediatr", "děts", "mimi"], "🏥": ["nemoc", "pohot"],
            "💊": ["recep", "lék", "alergo"], "👂": ["orl", "uši", "nos", "krk"], "🩹": ["kožní", "derma"],
            "🌡️": ["inter", "tepl", "hor"], "🤰": ["gyn", "porod"], "🧘": ["fyzio", "rehab", "cvičení"],
            "🩺": ["prak", "kont", "prev"]
        };

        function App() {
            // --- DATA ---
            const [entries, setEntries] = useState(() => JSON.parse(localStorage.getItem("hl_recs") || "[]"));
            const [names, setNames] = useState(() => JSON.parse(localStorage.getItem("hl_names") || '["Pacient 1", "Pacient 2"]'));
            
            const [activePerson, setActivePerson] = useState("Všichni");
            const [showAdd, setShowAdd] = useState(false);
            const [showSettings, setShowSettings] = useState(false);

            // Form
            const [form, setForm] = useState({ 
                person: names[0], date: new Date().toISOString().split("T")[0], 
                time: new Date().toLocaleTimeString('cs', {hour:'2-digit', minute:'2-digit'}), 
                doc: "", icon: "🩺", note: "" 
            });

            // Inteligentní ikona při psaní
            useEffect(() => {
                const txt = form.doc.toLowerCase();
                let found = "🩺";
                for (const [icon, keys] of Object.entries(ICON_MAP)) {
                    if (keys.some(k => txt.includes(k))) { found = icon; break; }
                }
                if(form.icon !== found) setForm(f => ({...f, icon: found}));
            }, [form.doc]);

            useEffect(() => localStorage.setItem("hl_recs", JSON.stringify(entries)), [entries]);
            useEffect(() => localStorage.setItem("hl_names", JSON.stringify(names)), [names]);

            // --- AKCE ---
            const saveEntry = () => {
                if(!form.doc) return;
                const newEntry = { ...form, id: Date.now() };
                setEntries([newEntry, ...entries]);
                setShowAdd(false);
                setForm({...form, doc: "", note: ""});
            };

            const deleteRec = (id) => {
                if(confirm("Smazat tento záznam?")) setEntries(entries.filter(e => e.id !== id));
            };

            const shareWA = () => {
                const txt = entries.map(e => `*${e.date}* | ${e.person}\n🏥 ${e.doc}\n📝 ${e.note}`).join('\n\n');
                window.open(`https://wa.me/?text=${encodeURIComponent("*ZDRAVOTNÍ DENÍK*\n\n" + txt)}`);
            };

            // --- LOGIKA TIMELINE ---
            const grouped = useMemo(() => {
                const filtered = activePerson === "Všichni" ? entries : entries.filter(e => e.person === activePerson);
                const sorted = [...filtered].sort((a,b) => new Date(b.date + ' ' + b.time) - new Date(a.date + ' ' + a.time));
                
                const g = {};
                sorted.forEach(e => {
                    const m = new Date(e.date).toLocaleString('cs', {month:'long', year:'numeric'});
                    if(!g[m]) g[m] = [];
                    g[m].push(e);
                });
                return g;
            }, [entries, activePerson]);

            return (
                <div className="max-w-md mx-auto min-h-screen pb-32">
                    {/* Header */}
                    <header className="fixed top-0 max-w-md w-full bg-black/80 backdrop-blur-xl z-50 px-6 py-4 flex justify-between items-center border-b border-white/10">
                        <div>
                            <h1 className="text-xl font-black text-white tracking-tighter">HEALTH<span className="text-blue-500">LOG</span></h1>
                            <p className="text-[10px] text-zinc-500 font-bold uppercase tracking-widest">Premium Edition</p>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={shareWA}><i data-lucide="share-2" className="w-5 h-5 text-zinc-400"></i></button>
                            <button onClick={() => setShowSettings(true)}><i data-lucide="settings" className="w-5 h-5 text-zinc-400"></i></button>
                        </div>
                    </header>

                    <div className="px-4 pt-24">
                        {/* Pacient filter */}
                        <div className="flex gap-2 overflow-x-auto no-scrollbar mb-8">
                            {["Všichni", ...names].map(p => (
                                <button key={p} onClick={() => setActivePerson(p)} className={`px-5 py-2 rounded-2xl text-sm font-bold transition-all whitespace-nowrap ${activePerson === p ? "bg-blue-600 text-white" : "bg-zinc-900 text-zinc-500 border border-white/5"}`}>{p}</button>
                            ))}
                        </div>

                        {/* Timeline */}
                        {Object.keys(grouped).length === 0 ? (
                            <div className="text-center py-20 text-zinc-700 font-bold uppercase tracking-widest text-xs">Žádné záznamy</div>
                        ) : (
                            Object.entries(grouped).map(([month, items]) => (
                                <div key={month} className="mb-8">
                                    <h2 className="text-blue-500 text-[11px] font-black uppercase mb-4 tracking-widest px-2">{month}</h2>
                                    <div className="space-y-3">
                                        {items.map(e => (
                                            <div key={e.id} className="bg-zinc-900/50 border border-white/5 p-4 rounded-[24px] flex gap-4 items-start shadow-xl">
                                                <div className="text-3xl bg-zinc-800 w-12 h-12 rounded-2xl flex items-center justify-center shrink-0">{e.icon}</div>
                                                <div className="flex-1">
                                                    <div className="flex justify-between items-start mb-1">
                                                        <span className="text-[10px] bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded-full font-bold uppercase">{e.person}</span>
                                                        <button onClick={() => deleteRec(e.id)} className="text-zinc-700 hover:text-red-500 transition-colors"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                    </div>
                                                    <h3 className="text-white font-bold text-lg">{e.doc}</h3>
                                                    <div className="flex gap-3 text-[11px] text-zinc-500 font-bold mt-1 uppercase">
                                                        <span>{e.date.split('-').reverse().join('.')}</span>
                                                        <span className="text-zinc-700">|</span>
                                                        <span>{e.time}</span>
                                                    </div>
                                                    {e.note && <p className="text-zinc-400 text-sm mt-3 leading-relaxed italic">"{e.note}"</p>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))
                        )}
                    </div>

                    {/* Floating Add Button */}
                    <button onClick={() => setShowAdd(true)} className="fixed bottom-8 left-1/2 -translate-x-1/2 bg-blue-600 text-white px-8 py-4 rounded-full font-black shadow-2xl shadow-blue-500/40 hover:scale-105 active:scale-95 transition-all flex items-center gap-3">
                        <i data-lucide="plus" className="w-6 h-6"></i> NOVÝ ZÁZNAM
                    </button>

                    {/* MODAL: ADD */}
                    <AnimatePresence>
                        {showAdd && (
                            <motion.div initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="fixed inset-0 z-[100] bg-black/90 backdrop-blur-md p-6 flex items-end sm:items-center justify-center">
                                <motion.div initial={{y:100}} animate={{y:0}} className="bg-zinc-950 w-full max-w-sm rounded-[40px] p-8 border border-white/10 shadow-2xl">
                                    <h2 className="text-2xl font-black text-white mb-6 tracking-tight">Nové vyšetření</h2>
                                    <div className="space-y-4">
                                        <div className="flex gap-2">
                                            {names.map(n => (
                                                <button key={n} onClick={() => setForm({...form, person: n})} className={`flex-1 py-3 rounded-2xl font-bold text-sm transition-all ${form.person === n ? "bg-blue-600 text-white" : "bg-zinc-900 text-zinc-600"}`}>{n}</button>
                                            ))}
                                        </div>
                                        <div className="relative">
                                            <span className="absolute left-4 top-1/2 -translate-y-1/2 text-2xl">{form.icon}</span>
                                            <input type="text" placeholder="Lékař / Obor..." value={form.doc} onChange={e => setForm({...form, doc: e.target.value})} className="w-full bg-zinc-900 border border-white/5 rounded-2xl py-4 pl-14 pr-4 text-white font-bold focus:border-blue-600 outline-none transition-all"/>
                                        </div>
                                        <div className="flex gap-2">
                                            <input type="date" value={form.date} onChange={e => setForm({...form, date: e.target.value})} className="flex-[2] bg-zinc-900 border border-white/5 rounded-2xl p-4 text-white font-bold outline-none"/>
                                            <input type="time" value={form.time} onChange={e => setForm({...form, time: e.target.value})} className="flex-1 bg-zinc-900 border border-white/5 rounded-2xl p-4 text-white font-bold text-center outline-none"/>
                                        </div>
                                        <textarea placeholder="Poznámka..." value={form.note} onChange={e => setForm({...form, note: e.target.value})} className="w-full bg-zinc-900 border border-white/5 rounded-2xl p-4 text-white h-24 outline-none focus:border-blue-600 resize-none"></textarea>
                                        <div className="flex gap-2 pt-2">
                                            <button onClick={() => setShowAdd(false)} className="flex-1 py-4 bg-zinc-900 text-zinc-500 rounded-2xl font-bold">Zrušit</button>
                                            <button onClick={saveEntry} className="flex-[2] py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg shadow-blue-600/30">Uložit</button>
                                        </div>
                                    </div>
                                </motion.div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* MODAL: SETTINGS */}
                    <AnimatePresence>
                        {showSettings && (
                            <motion.div initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="fixed inset-0 z-[100] bg-black/90 backdrop-blur-md p-6 flex items-center justify-center">
                                <div className="bg-zinc-950 w-full max-w-xs rounded-[40px] p-8 border border-white/10">
                                    <h2 className="text-xl font-black text-white mb-6">Nastavení jmen</h2>
                                    <div className="space-y-3">
                                        {names.map((n, i) => (
                                            <input key={i} type="text" value={n} onChange={e => {
                                                const copy = [...names]; copy[i] = e.target.value; setNames(copy);
                                            }} className="w-full bg-zinc-900 border border-white/5 rounded-2xl p-4 text-white font-bold outline-none focus:border-blue-600"/>
                                        ))}
                                        <button onClick={() => setShowSettings(false)} className="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold mt-4">Hotovo</button>
                                    </div>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Refresh icons after React render
        setTimeout(() => lucide.createIcons(), 500);
        // Refresh icons whenever the DOM updates
        const observer = new MutationObserver(() => lucide.createIcons());
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
</body>
</html>
